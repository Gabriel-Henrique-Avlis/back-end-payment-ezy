spring.application.name=payment

# Database - Use environment variables in production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# Encryption key (32 bytes for AES-256) - Use environment variable in production
encryption.key=${ENCRYPTION_KEY:n8f9k2m5L7jR3wQ6bN1vX4yP9sH8dF2a}

# Security headers
server.error.include-stacktrace=never
server.error.include-message=always
