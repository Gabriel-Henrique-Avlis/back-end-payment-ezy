spring.application.name=payment

# Database (configure for your Postgres container)
# Example: spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# Encryption key (Base64). Generate securely and keep secret.
# Example: openssl rand -base64 32
encryption.key=
